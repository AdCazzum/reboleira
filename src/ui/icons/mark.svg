<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ENSight">
  <!-- Marchio ENSight: una lente/occhio, cioè le due cose che l'estensione fa
       (guardare la pagina, rifrangerla nel profilo di chi legge).

       Griglia 32 con tratto di 4 unità perché i quattro formati che Chrome
       chiede stanno a 32 in rapporto 0.5x / 1x / 1.5x / 4x: il tratto cade su
       2, 4, 6 e 16 px esatti, mai a cavallo di mezzo pixel. Per lo stesso
       motivo qui non c'è nessun dettaglio sottile — a 16 px sopravvive solo
       una silhouette chiusa.

       La lente è RIEMPITA, non solo contornata: la toolbar di Chrome può
       essere chiara o scura, e con l'interno trasparente la pupilla scura
       spariva sul tema scuro lasciando un anello blu vuoto. Il riempimento
       rende il marchio autoportante su qualsiasi fondo — sui fondi chiari,
       dove coincide con la pagina, non si vede comunque.

       I colori qui sono attributi di presentazione, cioè il gradino più basso
       nella cascata SVG: valgono da soli quando questo file è aperto o
       rasterizzato, e qualunque regola CSS li scavalca. È così che le copie
       inline in src/ui/popup/popup.tsx e demo/onboarding.html si colorano coi
       token del contesto che le ospita senza ripetere un hex. La geometria è
       invece duplicata in quei due file: tests/mark.test.ts verifica che le
       tre copie non divergano. -->
  <path class="mark__lens" d="M3 16A13.45 13.45 0 0 1 29 16A13.45 13.45 0 0 1 3 16Z" fill="#ffffff" stroke="#0b57d0" stroke-width="4" stroke-linejoin="round" />
  <circle class="mark__pupil" cx="16" cy="16" r="4.5" fill="#14161a" />
</svg>
